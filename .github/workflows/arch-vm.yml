name: "🔥 Arch XFCE VM"

on:
  workflow_dispatch:

jobs:
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: "📦 Install host tools"
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            curl \
            wget \
            genisoimage

          mkdir -p "$HOME/archvm"

      - name: "💿 Download Arch"
        run: |
          set -eux
          cd "$HOME/archvm"

          ISO="$(
            curl -fsSL https://geo.mirror.pkgbuild.com/iso/latest/ |
            grep -oE 'archlinux-[0-9.]+-x86_64\.iso' |
            head -n1
          )"

          test -n "$ISO"

          wget \
            "https://geo.mirror.pkgbuild.com/iso/latest/$ISO" \
            -O archlinux.iso

          ls -lh archlinux.iso

      - name: "🤖 Build automatic installer"
        run: |
          set -eux
          cd "$HOME/archvm"

          mkdir -p payload

          cat > payload/install.sh <<'INSTALL'
          #!/usr/bin/env bash
          set -euxo pipefail

          echo "🔥 ARCH AUTOINSTALL STARTING"

          DISK=/dev/vda

          # --------------------------------------------------------
          # Disk
          # --------------------------------------------------------

          wipefs -af "$DISK"

          parted -s "$DISK" \
            mklabel gpt \
            mkpart ESP fat32 1MiB 513MiB \
            set 1 esp on \
            mkpart ROOT ext4 513MiB 100%

          mkfs.fat -F32 "${DISK}1"
          mkfs.ext4 -F "${DISK}2"

          mount "${DISK}2" /mnt

          mkdir -p /mnt/boot
          mount "${DISK}1" /mnt/boot

          # --------------------------------------------------------
          # Install Arch + XFCE + LARP PACKAGES™
          # --------------------------------------------------------

          pacstrap -K /mnt \
            base \
            linux \
            linux-firmware \
            sudo \
            networkmanager \
            grub \
            efibootmgr \
            xorg-server \
            xfce4 \
            xfce4-goodies \
            lightdm \
            lightdm-gtk-greeter \
            firefox \
            pipewire \
            pipewire-pulse \
            wireplumber \
            fastfetch \
            btop \
            htop \
            neovim \
            nano \
            git \
            curl \
            wget \
            tree \
            unzip \
            zip \
            ripgrep \
            fd \
            bat \
            eza \
            tmux \
            cowsay \
            lolcat \
            noto-fonts \
            noto-fonts-emoji

          genfstab -U /mnt >> /mnt/etc/fstab

          # --------------------------------------------------------
          # System configuration
          # --------------------------------------------------------

          arch-chroot /mnt ln -sf \
            /usr/share/zoneinfo/UTC \
            /etc/localtime

          arch-chroot /mnt hwclock --systohc

          echo "en_US.UTF-8 UTF-8" \
            >> /mnt/etc/locale.gen

          arch-chroot /mnt locale-gen

          echo "LANG=en_US.UTF-8" \
            > /mnt/etc/locale.conf

          echo "archbox" \
            > /mnt/etc/hostname

          # --------------------------------------------------------
          # User
          # --------------------------------------------------------

          arch-chroot /mnt useradd \
            -m \
            -G wheel,audio,video \
            -s /bin/bash \
            setin

          echo "setin:setin" |
            arch-chroot /mnt chpasswd

          echo "root:arch" |
            arch-chroot /mnt chpasswd

          echo "%wheel ALL=(ALL:ALL) ALL" \
            > /mnt/etc/sudoers.d/wheel

          chmod 440 /mnt/etc/sudoers.d/wheel

          # --------------------------------------------------------
          # Services
          # --------------------------------------------------------

          arch-chroot /mnt systemctl enable NetworkManager
          arch-chroot /mnt systemctl enable lightdm

          # --------------------------------------------------------
          # Bootloader
          # --------------------------------------------------------

          arch-chroot /mnt grub-install \
            --target=x86_64-efi \
            --efi-directory=/boot \
            --bootloader-id=ARCH \
            --removable

          arch-chroot /mnt grub-mkconfig \
            -o /boot/grub/grub.cfg

          # --------------------------------------------------------
          # Terminal greeting 😎
          # --------------------------------------------------------

          cat >> /mnt/home/setin/.bashrc <<'EOF'

          echo
          echo "🔥 Welcome to ArchBox"
          fastfetch
          EOF

          chown 1000:1000 /mnt/home/setin/.bashrc

          sync

          echo ""
          echo "======================================"
          echo "🔥 ARCH INSTALLATION COMPLETE 🔥"
          echo "======================================"
          echo ""
          echo "User: setin"
          echo "Password: setin"
          echo ""
          echo "Shutting down installer..."

          poweroff
          INSTALL

          chmod +x payload/install.sh

          genisoimage \
            -quiet \
            -o payload.iso \
            -V ARCHPAYLOAD \
            payload/

          ls -lh payload.iso

      - name: "💾 Create VM disk"
        run: |
          set -eux
          cd "$HOME/archvm"

          qemu-img create \
            -f qcow2 \
            arch.qcow2 \
            32G

      - name: "🚀 Start installer VM"
        run: |
          set -eux
          cd "$HOME/archvm"

          qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu max \
            -smp 2 \
            -m 3072 \
            -device virtio-vga \
            -device virtio-net-pci,netdev=n0 \
            -netdev user,id=n0 \
            -drive file=arch.qcow2,format=qcow2,if=virtio \
            -drive file=archlinux.iso,media=cdrom \
            -drive file=payload.iso,media=cdrom \
            -boot d \
            -vnc 127.0.0.1:0 \
            -daemonize \
            -pidfile qemu.pid

          sleep 5

          kill -0 "$(cat qemu.pid)"

          echo "🔥 QEMU alive"

      - name: "🖥️ Start noVNC"
        run: |
          set -eux
          cd "$HOME/archvm"

          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 3

          curl -f \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

      - name: "☁️ Start Cloudflare tunnel"
        run: |
          set -eux
          cd "$HOME/archvm"

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O cloudflared

          chmod +x cloudflared

          nohup ./cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > tunnel.log 2>&1 &

          echo $! > tunnel.pid

          URL=""

          for i in $(seq 1 30); do
            URL="$(
              grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              tunnel.log |
              head -n1 || true
            )"

            [ -n "$URL" ] && break

            sleep 2
          done

          test -n "$URL"

          echo ""
          echo "=============================================="
          echo "🔥 ARCH INSTALLER READY"
          echo ""
          echo "$URL/vnc.html?autoconnect=true&resize=scale"
          echo "=============================================="

      - name: "🧟 Keep VM alive"
        run: |
          cd "$HOME/archvm"

          echo ""
          echo "Once Arch reaches:"
          echo ""
          echo "root@archiso ~ #"
          echo ""
          echo "type ONLY:"
          echo ""
          echo "mkdir -p /mnt/payload && mount /dev/sr1 /mnt/payload && bash /mnt/payload/install.sh"
          echo ""
          echo "Then DON'T TOUCH ANYTHING 😭"
          echo ""

          while true; do
            sleep 30
          done
