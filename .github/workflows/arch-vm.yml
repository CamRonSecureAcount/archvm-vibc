name: "🔥 Arch Desktop VM"

on:
  workflow_dispatch:

jobs:
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # HOST SETUP
      # ============================================================

      - name: "📦 Install QEMU + noVNC"
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            curl \
            wget

          mkdir -p "$HOME/archvm"
          cd "$HOME/archvm"

          echo "🔥 Host ready"

      # ============================================================
      # DOWNLOAD ARCH
      # ============================================================

      - name: "💿 Download Arch Linux"
        run: |
          set -eux

          cd "$HOME/archvm"

          ISO="$(
            curl -fsSL https://geo.mirror.pkgbuild.com/iso/latest/ |
            grep -oE 'archlinux-[0-9.]+-x86_64\.iso' |
            head -n1
          )"

          test -n "$ISO"

          echo "Downloading $ISO"

          wget \
            "https://geo.mirror.pkgbuild.com/iso/latest/$ISO" \
            -O archlinux.iso

          ls -lh archlinux.iso

      # ============================================================
      # DISK
      # ============================================================

      - name: "💾 Create 32GB virtual disk"
        run: |
          set -eux

          cd "$HOME/archvm"

          qemu-img create \
            -f qcow2 \
            arch.qcow2 \
            32G

          qemu-img info arch.qcow2

      # ============================================================
      # FIRST BOOT
      # ============================================================

      - name: "🚀 Boot Arch installer"
        run: |
          set -eux

          cd "$HOME/archvm"

          qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu max \
            -smp 2 \
            -m 3072 \
            -device virtio-vga \
            -device virtio-net-pci,netdev=n0 \
            -netdev user,id=n0 \
            -drive file=arch.qcow2,format=qcow2,if=virtio \
            -cdrom archlinux.iso \
            -boot d \
            -vnc 127.0.0.1:0 \
            -daemonize \
            -pidfile qemu.pid

          sleep 8

          PID="$(cat qemu.pid)"

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "☠️ QEMU DIED"
            exit 1
          fi

          echo "🔥 Arch installer VM running"
          echo "PID: $PID"

      # ============================================================
      # NOVNC
      # ============================================================

      - name: "🖥️ Start noVNC"
        run: |
          set -eux

          cd "$HOME/archvm"

          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 3

          curl -f http://127.0.0.1:6080/vnc.html >/dev/null

          echo "🔥 noVNC alive"

      # ============================================================
      # CLOUDFLARE
      # ============================================================

      - name: "☁️ Install Cloudflare Tunnel"
        run: |
          set -eux

          cd "$HOME/archvm"

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O cloudflared

          chmod +x cloudflared

          ./cloudflared --version

      - name: "🌎 Open VM tunnel"
        run: |
          set -eux

          cd "$HOME/archvm"

          nohup ./cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > tunnel.log 2>&1 &

          echo $! > tunnel.pid

          URL=""

          for i in $(seq 1 30); do

            URL="$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                tunnel.log |
              head -n1 || true
            )"

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2
          done

          test -n "$URL"

          echo ""
          echo "================================================"
          echo "🔥🔥🔥 ARCH VM READY 🔥🔥🔥"
          echo ""
          echo "$URL/vnc.html?autoconnect=true&resize=scale"
          echo ""
          echo "================================================"

      # ============================================================
      # KEEP IT ALIVE
      # ============================================================

      - name: "🧟 Keep VM alive"
        run: |
          cd "$HOME/archvm"

          echo ""
          echo "VM IS ALIVE 😎"
          echo ""
          echo "Inside Arch, install using:"
          echo ""
          echo "archinstall"
          echo ""
          echo "Recommended:"
          echo "Desktop: XFCE"
          echo "Network: NetworkManager"
          echo "Audio: PipeWire"
          echo ""

          while true; do

            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo "☠️ QEMU DIED"
              exit 1
            fi

            if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
              echo "☠️ noVNC DIED"
              exit 1
            fi

            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
              echo "☠️ CLOUDFLARE DIED"
              exit 1
            fi

            sleep 30
          done
